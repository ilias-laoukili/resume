      fr: Université Gustave Eiffel / LAMA
    location:
      en: Champs-sur-Marne, France
      fr: Champs-sur-Marne, France
    dates:
      start: "2025-11"
      end: "2026-05"
    bullets:
      industry:
        en:
          - Investigated trade-offs between Graph Neural Network (GNN) performance and computational efficiency via graph sparsification.
          - Analyzed graph topology and sparsification patterns to reduce GNN computational overhead without accuracy degradation.
        fr:
          - Étude des compromis entre performance et efficacité de calcul des réseaux de neurones sur graphes (GNN) via la sparsification de graphes.
          - Analyse de la topologie des graphes et des schémas de sparsification afin de réduire le coût de calcul sans perte de précision.
      research_academic:
        en:
          - Investigated deterministic graph sparsification to optimize Graph Neural Network (GNN) training and computational efficiency.
          - Built a synthetic graph and spectral sparsification library in **Rust** ([plekton](https://github.com/ilias-laoukili/plekton)) with zero-copy Python bindings for controlled empirical evaluation.
          - Wrote **Bash** scripts to run hyperparameter sweeps sequentially, parallelizing lightweight experiments and isolating memory-intensive ones to prevent OOM errors.
        fr:
          - Étude de la sparsification déterministe de graphes pour optimiser l'entraînement et l'efficacité de calcul des GNN.
          - Développement d'une bibliothèque en **Rust** ([plekton](https://github.com/ilias-laoukili/plekton)) avec bindings Python zero-copy pour générer des graphes contrôlés et évaluer la sparsification spectrale.
          - Écriture de scripts **Bash** orchestrant les balayages d'hyperparamètres (parallélisation des essais légers, isolation des expériences gourmandes en mémoire pour éviter les erreurs OOM).

