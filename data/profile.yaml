  - id: lama
    variants: [industry, research_academic]
    role:
      industry:
        en: Research Assistant (Tremplin Recherche)
        fr: Assistant de recherche (Tremplin Recherche)
      research_academic:
        en: Tremplin Recherche -- Research Initiation (ML Systems & Graph Neural Networks)
        fr: Tremplin Recherche -- Initiation à la recherche (Systèmes ML et GNN)
    organization:
