summary:
  industry:
    en: >-
      AI & Cybersecurity engineering student and M.Sc. (Research) candidate at Université Laval,
      currently serving as an AI Advisor at the Ministère de la Cybersécurité et du Numérique (MCN).
      Hands-on experience building RAG, GNN, and high-performance Rust/Python ML systems across
      research at LAMA (Université Gustave Eiffel) and an R&D internship at Nanyang Polytechnic, Singapore.
    fr: >-
      Élève-ingénieur en IA et cybersécurité et étudiant à la maîtrise recherche (M.Sc.) à l'Université Laval,
      actuellement conseiller en intelligence artificielle au ministère de la Cybersécurité et du Numérique (MCN).
      Expérience pratique en systèmes RAG, GNN et bibliothèques Rust/Python haute performance (recherche au LAMA,
      stage R&D à Nanyang Polytechnic, Singapour).
  research_academic:
    en: >-
      Engineering student specializing in Machine Learning and Cybersecurity, with research experience in
      Graph Neural Networks and ML Systems. Currently enrolled in the M.Sc. (Research) program at Université Laval,
      supervised by Prof. Talal Halabi, and working part-time as an AI Advisor at the Ministère de la Cybersécurité
      et du Numérique (MCN).
    fr: >-
      Élève-ingénieur spécialisé en apprentissage automatique et cybersécurité, avec une expérience de recherche
      en réseaux de neurones sur graphes (GNN) et systèmes ML. Actuellement inscrit à la maîtrise recherche (M.Sc.)
      à l'Université Laval sous la direction du Prof. Talal Halabi, et conseiller en IA (emploi étudiant) au
      ministère de la Cybersécurité et du Numérique (MCN).

