projects:
  - id: plekton
    variants: [industry]
    title:
      en: plekton -- Synthetic Graph & Spectral Sparsification Library
      fr: plekton -- Bibliothèque Rust/Python de graphes synthétiques et sparsification
    url: https://github.com/ilias-laoukili/plekton
    tech:
      en: Rust, PyO3, Python, GNNs
      fr: Rust, PyO3, Python, GNN
    dates:
      single: "2026"
    bullets:
      en:
        - Engineered a pure-Rust library with zero-copy Python bindings for synthetic graph generation, stochastic blockmodel fitting, structural metrics, and spectral sparsification.
        - Designed for reproducible, high-throughput GNN benchmarking with direct interoperability with Python ML pipelines.
      fr:
        - Conception d'une bibliothèque en Rust pur avec bindings Python zero-copy pour la génération de graphes synthétiques, l'ajustement de modèles à blocs stochastiques, les métriques structurelles et la sparsification spectrale.
        - Pensée pour le benchmarking reproductible et rapide de GNN avec intégration directe aux pipelines ML Python.

  - id: software_security
    variants: [research_academic]
    title:
      en: Applied Software Security & Vulnerability Exploitation
      fr: Sécurité logicielle appliquée et exploitation de vulnérabilités
    url: null
    tech:
      en: ESIEE Paris
      fr: ESIEE Paris
    dates: null
    bullets:
      en:
        - "**Reverse Engineering:** Conducted low-level analysis on stripped x86-64 Linux binaries using GDB/objdump. Bypassed ptrace anti-debugging and code integrity constraints via byte patching, and developed automated keygens in C."
        - "**Web Security:** Automated Blind SQL Injection data extraction by developing a custom Python exploit script."
      fr:
        - "**Rétro-ingénierie :** Analyse bas niveau de binaires Linux x86-64 strippés avec GDB/objdump ; contournement de protections anti-débogage (`ptrace`) et d'intégrité par patch binaire, et écriture de générateurs de clés automatisés en C."
        - "**Sécurité Web :** Automatisation de l'extraction de données par injection SQL aveugle (Blind SQLi) via un script d'exploitation Python dédié."

  - id: sentim
    variants: [industry, research_academic]
    title:
      industry:
        en: Sentim -- AI-Powered Audio Emotion Analysis
        fr: Sentim -- Analyse d'émotions audio par IA
      research_academic:
        en: Sentim -- Deep Learning for Audio Emotion Analysis
        fr: Sentim -- Deep Learning pour la reconnaissance d'émotions audio
    url: https://github.com/ilias-laoukili/sentim-app
    tech:
      industry:
        en: Python, PyTorch, Librosa, Streamlit
        fr: Python, PyTorch, Librosa, Streamlit
      research_academic:
        en: Python, Librosa, PyTorch, Streamlit
        fr: Python, Librosa, PyTorch, Streamlit
    dates:
      single: "2025-11"
    bullets:
      industry:
        en:
          - Built an end-to-end audio emotion analysis platform classifying 8 emotions from speech (RAVDESS), combining DSP features (MFCCs, Chroma, Tonnetz) with 2D-spectrogram CNN/ResNet models outperforming Random Forest baselines.
          - Deployed an interactive Streamlit dashboard for real-time acoustic visualization and prosody manipulation.
        fr:
          - Conception d'une plateforme complète de classification de 8 émotions vocales (RAVDESS), combinant extraction DSP (MFCC, Chroma, Tonnetz) et modèles CNN/ResNet sur spectrogrammes 2D surpassant la baseline Random Forest.
          - Déploiement d'un tableau de bord Streamlit interactif pour la visualisation acoustique en temps réel et la manipulation prosodique.
      research_academic:
        en:
          - Built an end-to-end pipeline for audio emotion recognition, from raw waveform processing to model training and deployment.
          - Processed raw audio into 2D spectrograms and evaluated multiple architectures, including a custom 2-layer CNN and a fine-tuned ResNet, outperforming baseline Random Forest models. Deployed via a real-time Streamlit dashboard.
        fr:
          - Pipeline complet de reconnaissance d'émotions audio, du prétraitement du signal brut jusqu'à l'entraînement et au déploiement.
          - Conversion en spectrogrammes 2D et évaluation comparative (CNN 2 couches sur mesure et ResNet affiné surpassant la baseline Random Forest), avec tableau de bord Streamlit temps réel.

