name: Compile LaTeX CV

on:
  push:
    branches: [main]
    paths:
      - 'src/**.tex'
      - '.github/workflows/compile.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile LaTeX to PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: src/main.tex
          latexmk_use_pdflatex: true
          args: -pdf -outdir=../output -interaction=nonstopmode -file-line-error

      - name: Rename output PDF
        run: mv output/main.pdf resume.pdf

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: resume
          path: resume.pdf
          retention-days: 90

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest CV
          files: resume.pdf
          make_latest: true
